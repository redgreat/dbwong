[package]
name = "dbwong"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros","rt-multi-thread","net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
deadpool-postgres = "0.14"
tokio-postgres = "0.7"
native-tls = "0.2"
postgres-native-tls = "0.5"
