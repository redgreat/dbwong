name: Publish release image
on:
  release:
    types: [published]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/redgreat/dbwong:${{ github.event.release.tag_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/redgreat/dbwong
            org.opencontainers.image.revision=${{ github.sha }}
