<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>dbwong</title>
<style>
:root{font:15px/1.55 system-ui,"Microsoft YaHei",sans-serif;color:#172746;background:#ecf2fa;--blue:#345dd0;--line:#dce5f2;--muted:#536784}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 85% 8%,#c9dcff,transparent 48%),radial-gradient(ellipse at 12% 92%,#d5eae9,transparent 50%),#eff4fb}
a{color:inherit;text-decoration:none}
header{min-height:68px;display:flex;align-items:center;gap:24px;padding:12px clamp(18px,4vw,56px);background:#f9fbffbf;border-bottom:1px solid #fff;backdrop-filter:blur(20px)}
header strong{font-size:21px;letter-spacing:-.04em;margin-right:auto}
.mark{display:inline-grid;place-items:center;width:34px;height:34px;margin-right:9px;border-radius:10px;background:#2849aa;color:white;font-size:19px}
header a{color:var(--muted)}
header a[aria-current],header a:hover{color:var(--blue)}
main{max-width:1280px;margin:auto;padding:36px clamp(16px,4vw,48px)}
h1,h2,p{margin:0}h1{font-size:clamp(25px,4vw,36px);letter-spacing:-.045em}h2{font-size:17px}
#message{color:#304d85;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:14px 0}
#message:empty{display:none}
body.signin main{max-width:480px;min-height:calc(100dvh - 68px);display:flex;flex-direction:column;justify-content:center;padding-block:40px 80px}
.signin h1{margin-bottom:18px}
section,form,aside{padding:clamp(16px,3vw,25px);background:#ffffffbd;border:1px solid #fff;border-radius:20px;box-shadow:0 12px 32px #293f6f12;backdrop-filter:blur(18px)}
form,section{min-width:0}form{display:grid;gap:13px;align-content:start}
#login{padding:clamp(22px,5vw,38px);gap:19px}
label{display:grid;gap:6px;font-size:14px;color:#394d6b}
input,select,button{font:inherit;border-radius:9px;min-height:42px;padding:8px 12px}
input,select{width:100%;min-width:0;border:1px solid #bdcce2;background:#fff;color:inherit}
button{border:1px solid transparent;background:var(--blue);color:#fff;cursor:pointer;font-weight:650}
button:hover:not(:disabled){background:#2547ac}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:3px solid #476fe7;outline-offset:3px}
#probe,#logout{background:#e8effe;color:#294a96}
#content{margin-top:22px}
.dashboard{display:grid;grid-template-columns:188px minmax(0,1fr);gap:20px;align-items:start}
aside{position:sticky;top:16px;padding:14px;background:#17294bea;color:white}
aside nav{display:grid;gap:5px}
aside button{text-align:left;background:transparent;color:#dfebff;font-weight:500}
aside button[aria-pressed=true]{background:#3d60a9;color:white}
[data-panel]{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
[data-panel] section{grid-column:1/-1}
ul{list-style:none;margin:12px 0 0;padding:0}
li{padding:10px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
small{color:var(--muted)}
@media(max-width:760px){.dashboard,[data-panel]{grid-template-columns:minmax(0,1fr)}aside{position:static}aside nav{grid-template-columns:repeat(2,minmax(0,1fr))}header{gap:12px}}
@media(prefers-reduced-transparency:reduce){header,section,form{background:#fff;backdrop-filter:none}aside{background:#17294b;backdrop-filter:none}}
</style>
<header><strong><span class="mark" aria-hidden="true">D</span>dbwong</strong><a href="/">工作台</a><a href="/admin">管理后台</a><button id="logout" hidden>退出</button></header>
<main><h1 id="heading"></h1><p id="message" role="status"></p>
<form id="login" hidden><h2>登录账号</h2><label>账号<input name="name" required autocomplete="username"></label><label>密码<input name="password" type="password" required autocomplete="current-password"></label><button>登录</button></form>
<div id="content" hidden><div id="dashboard">
<aside id="sidebar" hidden><nav aria-label="后台菜单">
<button type="button" data-view="connections" aria-pressed="true">数据库连接</button>
<button type="button" data-view="accounts" aria-pressed="false">账号管理</button>
<button type="button" data-view="access" aria-pressed="false">读取授权</button>
<button type="button" data-view="settings" aria-pressed="false">会话设置</button>
</nav></aside>
<div id="workspace"><div data-panel="connections"><section><h2>数据库连接</h2><ul id="connections"></ul></section>
<form id="connection"><h2>登记连接</h2><label>名称<input name="name" required></label><label>引擎<select name="engine"><option>mysql</option><option>postgres</option><option>mssql</option><option>mongo</option><option>redis</option></select></label><label>环境<select name="environment"><option value="test">测试</option><option value="production">生产</option></select></label><label>连接串<input name="dsn" type="password" required autocomplete="off"></label><button>保存</button></form>
<form id="edit_connection"><h2>维护已登记连接</h2><label>连接<select name="target" required></select></label><label>名称<input name="name" required></label><label>环境<select name="environment"><option value="test">测试</option><option value="production">生产</option></select></label><label>状态<select name="enabled"><option value="yes">启用</option><option value="no">停用</option></select></label><label>新连接串（留空沿用）<input name="dsn" type="password" autocomplete="off"></label><button>保存修改</button><button type="button" id="probe">测试已保存的 PostgreSQL 连接</button></form>
</div><div data-panel="accounts" hidden><form id="account"><h2>创建 DBA 账号</h2><label>账号<input name="name" required></label><label>密码（12–72 字节）<input name="password" type="password" required autocomplete="new-password"></label><button>创建</button></form>
<form id="account_status"><h2>账号状态</h2><label>DBA 账号<select name="account" required></select></label><label>操作<select name="enabled"><option value="no">停用并结束会话</option><option value="yes">恢复登录</option></select></label><button>应用</button></form>
<form id="reset_password"><h2>重置 DBA 密码</h2><label>DBA 账号<select name="account" required></select></label><label>新密码（12–72 字节）<input name="password" type="password" autocomplete="new-password" required></label><button>重置并结束会话</button></form>
</div><div data-panel="settings" hidden><form id="session_hours"><h2>会话设置</h2><label>新登录会话有效期（小时）<input name="hours" type="number" min="1" max="168" required></label><button>保存</button></form></div><div data-panel="access" hidden><form id="grant"><h2>读取授权</h2><label>账号<select name="account" required></select></label><label>连接<select name="connection" required></select></label><label>操作<select name="allow"><option value="yes">授予读取</option><option value="no">撤销读取</option></select></label><button>应用</button><ul id="grants"></ul></form></div></div></div></div></main>
<script type="module">
const el=id=>document.getElementById(id);
const admin=location.pathname.startsWith('/admin');
const heading=admin?'管理后台':'我的工作台';
el('heading').textContent=heading;
document.title=heading+' · dbwong';
document.querySelector(admin?'header a[href="/admin"]':'header a[href="/"]').setAttribute('aria-current','page');
const panels=[...document.querySelectorAll('[data-panel]')];
const menu=[...document.querySelectorAll('[data-view]')];
for(const button of menu) button.onclick=()=>{
 for(const item of menu) item.setAttribute('aria-pressed',String(item===button));
 for(const panel of panels) panel.hidden=panel.dataset.panel!==button.dataset.view;
 el('message').textContent='';
};
async function api(path,body){
 const options=body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)};
 const response=await fetch(path,{...options,cache:'no-store'});
 if(!response.ok)throw Object.assign(new Error(({400:'请检查表单内容',401:'请使用有效账号和密码登录',403:'当前账号没有此权限',409:'名称已存在'})[response.status]||'服务暂不可用'),{status:response.status});
 return response.headers.get('content-type')?.includes('application/json')?response.json():null;
}
function list(id,values){el(id).replaceChildren(...values.map(text=>{const li=document.createElement('li');li.textContent=text;return li}))}
function options(name,rows){el('grant').elements[name].replaceChildren(...rows.map(r=>new Option(r.name,r.id)))}
async function refresh(){
 el('content').hidden=true;
 try{
 const data=await api(admin?'/api/admin':'/api/connections');
 const rows=admin?data.connections:data;
 list('connections',rows.length?rows.map(r=>r.name+' · '+r.engine+' · '+(r.environment==='production'?'生产':'测试')):['暂无连接']);
 if(admin){el('session_hours').elements.hours.value=data.session_hours;options('account',data.accounts);options('connection',rows);
 for(const id of ['reset_password','account_status']) {
   const choices=data.accounts.filter(a=>!a.admin).map(a=>new Option(a.name+(a.enabled?'':'（已停用）'),a.id));
   el(id).elements.account.replaceChildren(...choices)
 }
 const edit=el('edit_connection').elements;
 edit.target.replaceChildren(...rows.map(r=>new Option(r.name+(r.enabled?'':'（已停用）'),r.id)));
 function selectConnection(){
   const row=rows.find(r=>r.id===Number(edit.target.value));
   edit.name.value=row?.name??'';edit.dsn.value='';edit.environment.value=row?.environment??'test';
   edit.enabled.value=row?.enabled?'yes':'no';
   el('probe').disabled=!row?.enabled||row.engine!=='postgres';
 }
 edit.target.onchange=selectConnection;selectConnection();
 const names=new Map(data.accounts.map(r=>[r.id,r.name])), labels=new Map(rows.map(r=>[r.id,r.name]));
 list('grants',data.grants.map(([a,c])=>names.get(a)+' → '+labels.get(c)))}
 el('login').hidden=true;el('content').hidden=false;el('sidebar').hidden=!admin;el('dashboard').classList.toggle('dashboard',admin);
 if(!admin){el('connection').hidden=true;el('edit_connection').hidden=true}
 document.body.classList.remove('signin');el('heading').textContent=heading;el('logout').hidden=false;
 }catch(e){document.body.classList.add('signin');el('heading').textContent=admin?'管理后台登录':'登录工作台';el('login').hidden=false;el('logout').hidden=e.status===401;el('message').textContent=e.status===401?'':e.message}
}
for(const form of document.forms)form.onsubmit=async event=>{
 event.preventDefault();const data=Object.fromEntries(new FormData(form));const signin=form.getAttribute('id')==='login';
 if(form.getAttribute('id')==='account_status'||form.getAttribute('id')==='reset_password')data.account=Number(data.account);
 if(form.getAttribute('id')==='account_status')data.enabled=data.enabled==='yes';
 if(form.getAttribute('id')==='edit_connection'){data.id=Number(data.target);delete data.target;data.enabled=data.enabled==='yes'}
 if(form.getAttribute('id')==='session_hours') data.hours=Number(data.hours);
 if(form.getAttribute('id')==='grant'){data.account=Number(data.account);data.connection=Number(data.connection);data.allow=data.allow==='yes'}
 try{await api(signin?'/api/login':'/api/admin',signin?data:{action:form.getAttribute('id'),...data});form.reset();el('message').textContent=signin?'':'已保存';await refresh()}catch(e){el('message').textContent=e.message}
};
el('probe').onclick=async()=>{
 const connection=Number(el('edit_connection').elements.target.value);
 try{const result=await api('/api/admin/probe',{connection});
 el('message').textContent=({'probe.ok':'已连接，查询成功','probe.failed':'连接或认证失败','probe.timeout':'连接测试超时'})[result.outcome]}
 catch(e){el('message').textContent=e.message}
};
el('logout').onclick=async()=>{try{await api('/api/logout',{});location.reload()}catch(e){el('message').textContent=e.message}};
refresh();
</script></html>
